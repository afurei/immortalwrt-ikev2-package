name: Build ImmortalWrt IKEv2 package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl \
            zstd

      - name: Checkout ImmortalWrt 25.12 source
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: openwrt-25.12
          path: immortalwrt

      - name: Checkout IKEv2 LuCI app
        uses: actions/checkout@v4
        with:
          repository: ksong008/luci-app-ipsec-ikev2
          path: luci-app-ipsec-ikev2

      - name: Configure feeds and package
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          mkdir -p package/custom
          cp -a ../luci-app-ipsec-ikev2 package/custom/
          echo 'CONFIG_TARGET_rockchip=y' >> .config
          echo 'CONFIG_TARGET_rockchip_armv8=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-ipsec-ikev2=m' >> .config
          make defconfig
          
      - name: Install Python ELF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyelftools
          python3 -c "import elftools; print('pyelftools OK')"

      - name: Build plugin package
        working-directory: immortalwrt
        run: |
        
          make download -j"$(nproc)" || true
          make package/luci-app-ipsec-ikev2/compile V=s -j"$(nproc)"

      - name: Collect generated APKs and build diagnostics
        if: always()
        run: |
          mkdir -p artifact/packages
          find immortalwrt/bin/packages immortalwrt/bin/targets \
            -type f -name '*.apk' -exec cp -n {} artifact/packages/ \; 2>/dev/null || true
          find artifact/packages -maxdepth 1 -type f -name '*.apk' -printf '%f\n' \
            | sort > artifact/APK-FILES.txt
          {
            echo "Build target: rockchip/armv8"
            echo "Source branch: ImmortalWrt openwrt-25.12"
            echo
            echo "This artifact collects APKs generated by this build only."
            echo "It is NOT guaranteed to contain every runtime dependency."
            echo "Check the build log and the router's configured 25.12.2 repositories"
            echo "before installing. Do not force-install kernel modules from a mismatched kernel ABI."
          } > artifact/README.txt
          tar -czf immortalwrt-ikev2-apks.tar.gz artifact

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-rockchip-armv8-ikev2
          path: |
            immortalwrt-ikev2-apks.tar.gz
            artifact/APK-FILES.txt
            artifact/README.txt
          if-no-files-found: warn
          retention-days: 14
